name: documentation
on: [push]
permissions:
  contents: write
jobs:
  docs:
    if: startsWith(github.event.ref, 'refs/tags/wiki')  # only redo the wiki when asked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - uses: pyvista/setup-headless-display-action@v3
      - name: Install dependencies
        run: |
          pip install sphinx sphinx_rtd_theme myst_parser pyvista numpy scipy sphinx_design sphinx-copybutton trame-vtk 'pyvista[jupyter]' sphinxcontrib.asciinema pydata-sphinx-theme shanc
      - name: Sphinx build
        run: |
          sphinx-build doc _build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/
          force_orphan: true
